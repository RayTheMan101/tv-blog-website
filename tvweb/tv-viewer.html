<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Viewer</title>
    <!-- Bootstrap for responsive design -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Browser tab icon -->
    <link rel="icon" type="image/x-icon" href="tv.ico">
    <!-- Inline styles for fullscreen TV viewer display -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #viewerContainer {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #tvPickerOverlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: rgba(0,0,0,0.8);
            z-index: 30;
        }

        #tvPickerTitle {
            color: #fff;
            font-size: 22px;
            letter-spacing: 0.5px;
        }

        #tvPickerGrid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            width: min(90vw, 600px);
        }

        .tv-tile {
            border: 2px solid #0d6efd;
            color: #fff;
            background: rgba(13,110,253,0.12);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .tv-tile:hover { background: rgba(13,110,253,0.25); transform: translateY(-2px); }

        #waitingMessage {
            color: #fff;
            font-size: 24px;
            text-align: center;
            padding: 20px;
        }
        
        #statusInfo {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #888;
            font-size: 14px;
            font-family: monospace;
            z-index: 10;
        }
        
        #videoPlayer,
        #pictureViewer {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Keep aspect ratio, scale within screen */
            background-color: #000;
        }

        /* Fullscreen mode: make media fill the viewport while preserving aspect ratio */
        #viewerContainer:fullscreen #videoPlayer,
        #viewerContainer:fullscreen #pictureViewer,
        #viewerContainer:-webkit-full-screen #videoPlayer,
        #viewerContainer:-webkit-full-screen #pictureViewer {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
        }

        /* Fullscreen mode adjustments */
        #viewerContainer:fullscreen #videoPlayer,
        #viewerContainer:-webkit-full-screen #videoPlayer,
        #viewerContainer:-moz-full-screen #videoPlayer,
        #viewerContainer:-ms-fullscreen #videoPlayer {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }

        #viewerContainer:fullscreen #pictureViewer,
        #viewerContainer:-webkit-full-screen #pictureViewer,
        #viewerContainer:-moz-full-screen #pictureViewer,
        #viewerContainer:-ms-fullscreen #pictureViewer {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div id="viewerContainer">
        <button id="backButton" class="btn btn-sm btn-outline-light" style="position:absolute; top:20px; left:20px; z-index:1000; display:none; pointer-events:auto;">← Back</button>
        <div id="tvPickerOverlay" style="display:flex;">
            <div id="tvPickerTitle">Select a TV to connect</div>
            <div id="tvPickerGrid"></div>
        </div>
        <!-- Waiting message shown while connecting to TV -->
        <div id="waitingMessage">Waiting for connection...</div>
        <!-- Video and image players for content display -->
        <video id="videoPlayer" style="display: none;"></video>
        <img id="pictureViewer" style="display: none;">
        <!-- Status indicator in bottom left corner -->
        <div id="statusInfo">TV Viewer | Select a TV tile</div>
        <!-- Sound control button (hidden by default) -->
        <button id="enableSoundBtn" style="position:absolute; bottom:20px; right:20px; display:none; padding:10px 14px; border:none; border-radius:6px; background:#0d6efd; color:#fff; cursor:pointer;">Enable sound</button>
    </div>

    <!-- TV viewer connection and display logic -->
    <script src="tv-viewer.js"></script>
</body>
</html>
